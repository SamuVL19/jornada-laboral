services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jornada_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - jornada_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
    container_name: jornada_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - jornada_network

networks:
  jornada_network:
    driver: bridge